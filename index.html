<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Brevify</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-wrap">
          <h1>Brevify</h1>
        </div>
        <button id="newChatBtn" class="new-chat-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          New Chat
        </button>
      </div>

      <div class="chat-history">
        <p class="history-label">Recent</p>
        <button class="history-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Current Conversation
        </button>
        <button class="history-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Summarize meeting notes
        </button>
        <button class="history-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
          Elaborate project proposal
        </button>
      </div>

      <div class="sidebar-footer">
        <button id="themeToggleBtn" class="theme-toggle">
          <span class="btn-icon" aria-hidden="true" id="themeIcon">
            <!-- Moon icon for default dark -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </span>
          <span id="themeToggleLabel">Light Mode</span>
        </button>
      </div>
    </aside>

    <main class="workspace is-empty" id="workspace">
      <div class="chat-container" id="chatContainer">
        <!-- Empty State initially -->
        <div class="empty-state" id="emptyState">
          <h2 id="greetingTitle">What are you working on?</h2>
        </div>
      </div>

      <div class="input-container">
        <!-- Input Area -->
        <div class="input-box-wrapper">
          <textarea id="promptInput" placeholder="Ask Brevify to summarize or elaborate your text..."></textarea>
          
          <div class="input-actions">
            <div class="input-actions-left">
              <button id="attachBtn" class="icon-btn" title="Upload File or Scan">
                <svg viewBox="0 0 24 24" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button id="toggleCameraModalBtn" class="icon-btn" title="Open Camera">
                <svg viewBox="0 0 24 24" fill="none"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
            <div class="input-actions-right">
              <span class="char-count">0 words</span>
            </div>
          </div>
        </div>

        <!-- Options row below the input -->
        <div class="options-row">
          <button id="condenseBtn" class="pill-btn primary">
            <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Summarize</span>
          </button>
          <button id="elaborateBtn" class="pill-btn secondary">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v16m0 0-4-4m4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Elaborate</span>
          </button>

          <div class="select-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            <select id="lengthOption" class="pill-select">
              <option>1-2 sentences</option>
              <option selected>Short (3-5 sentences)</option>
              <option>Medium (1 paragraph)</option>
              <option>Bullet points</option>
            </select>
          </div>
          <div class="select-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <select id="languageOption" class="pill-select">
              <option selected>English</option>
              <option>Hindi</option>
              <option>Spanish</option>
              <option>French</option>
            </select>
          </div>
          <div class="select-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="6"></circle><circle cx="12" cy="12" r="2"></circle></svg>
            <select id="focusOption" class="pill-select">
              <option selected>Main ideas</option>
              <option>Key points</option>
              <option>Detailed summary</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Hidden elements for file uploads and camera modal -->
      <input type="file" id="fileInput" hidden>
      <input type="file" id="cameraImageInput" accept="image/*" hidden>
      
      <div id="cameraModal" class="modal-overlay" style="display: none;">
        <div class="modal-content camera-lens">
          <div class="lens-header">
            <span class="lens-dot"></span><p>Live Text Scanner</p>
            <button id="closeCameraBtn" class="close-modal">&times;</button>
          </div>
          <div class="camera-preview">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas"></canvas>
            <div id="cameraPlaceholder"><span>Scan</span><p>Point camera at notes or handwriting</p><small>Tap shutter to scan text</small></div>
            <div class="scan-corners"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="lens-controls">
            <button id="uploadImageBtn" class="lens-btn lens-side">
              <svg viewBox="0 0 24 24" fill="none"><path d="M7 16h10M12 3v9m0-9 3.5 3.5M12 3 8.5 6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="16" width="16" height="5" rx="1.8" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
            <button id="captureBtn" class="lens-btn lens-shutter"></button>
            <button id="toggleCameraBtn" class="lens-btn lens-side">
              <svg viewBox="0 0 24 24" fill="none"><path d="M12 3v8m0 0 3-3m-3 3-3-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 14a6 6 0 1 0 12 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
          <p id="cameraStatus" class="camera-status">Ready to scan.</p>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <p>Powered by Hugging Face • OCR by Tesseract.js • Runs in your browser</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
